name: Windows build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, check and publish x64
        shell: pwsh
        run: ./Build.ps1
      - name: Publish ARM64
        shell: pwsh
        run: ./Build.ps1 -Runtime win-arm64 -SkipSmoke
      - name: Upload portable apps
        uses: actions/upload-artifact@v4
        with:
          name: TroLyMayTinh-portable
          path: artifacts/**/*.exe
          if-no-files-found: error
      - name: Upload UI check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WPF-check-results
          path: |
            smoke-results.txt
            artifacts/ui-checks/*.png
          if-no-files-found: ignore
